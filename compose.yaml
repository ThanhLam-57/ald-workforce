name: ald-workforce

services:
  postgres:
    image: postgres:17.7-alpine3.23
    environment:
      POSTGRES_DB: ald_workforce
      POSTGRES_PASSWORD: ald_local_password
      POSTGRES_USER: ald
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ald_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ald -d ald_workforce"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: ald-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile: infra/minio/Dockerfile
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ald_minio
      MINIO_ROOT_PASSWORD: ald_minio_local_password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ald_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  ald_postgres_data:
  ald_minio_data:
